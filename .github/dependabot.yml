# Keeps the SHA-pinned actions in .github/workflows and the Gradle
# dependencies (gradle/libs.versions.toml, the wrapper) up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
