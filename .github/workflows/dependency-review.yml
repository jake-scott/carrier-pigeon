name: Dependency review

# Submits the Gradle dependency graph and reviews what a pull request changes
# in it.
#
# GitHub's dependency graph doesn't see Gradle dependencies on its own (only
# the actions and the pip requirements), so the submission job resolves the
# build with gradle/actions/dependency-submission and uploads the result:
# on pushes to dev and main, so the base of a pull request has a graph, and on
# pull requests, for the head. The review job then compares the two with
# actions/dependency-review-action and fails on a dependency with a known
# vulnerability, at any severity.
#
# Dependabot's own pull requests get a read-only token, which can't submit a
# graph, so for them the job is skipped and the review covers only what GitHub
# sees itself. Their Gradle bumps are reviewed in full on the combined pull
# request (combine-dependabot.yml), which isn't Dependabot's.
#
# Resolving runs the build's Gradle code, with dependency verification on.
# It does so on pushes to dev and main, which hold only reviewed code, and on
# pull requests, whose Actions cache is their own; never from a scheduled or
# manually started run on the default branch.

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  submission:
    if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      # To submit the graph.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: versionName counts commits (app/build.gradle.kts).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  review:
    needs: submission
    # The submission job is skipped for Dependabot's pull requests.
    if: >-
      always() && github.event_name == 'pull_request' &&
      (needs.submission.result == 'success' || needs.submission.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The head's graph can land a little after the submission job ends.
          retry-on-snapshot-warnings: true
