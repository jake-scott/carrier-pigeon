name: Release

# Builds Carrier Pigeon, signs it with the app's keys in Cloud KMS
# (mobile-build-infra, build/apps.tf) and ships it. docs/signing.md has the
# whole picture.
#
#   trigger          channel   GitHub env  built            signed with        goes to
#   push to dev      dev       dev         dev APK          dev key            Firebase App Distribution
#                                                                              (group carrier-pigeon-dev)
#   push to main     internal  qa          prod bundle      play (upload) key  Play internal track
#   tag vX.Y.Z-rc.N  closed    qa          nothing          nothing            the internal build of that
#                                                                              commit, promoted to closed
#   tag vX.Y.Z       prod      prod        prod APK,        release key        the closed build of that commit
#                                          rebuilt and                         promoted to production, then
#                                          checked                             the GitHub release (F-Droid
#                                                                              builds the tag)
#
# One Play bundle per release. main builds and uploads it; the tags only move
# it forward a track, unchanged, so production users get the bytes closed
# testers ran. Tag main's latest build with an rc tag, and give the release
# tag the same commit as the rc testers have.
#
# Which bundle. A tag never trusts a release's name on Play: anything that
# can write to a testing track can name a release whatever it likes. The
# `bundle` job finds the main run that built the tagged commit, takes its
# version code (run number + 100000) and its bundle, and checks the bundle's
# build provenance: made by this file, on main, from that commit. Play
# never reuses a version code, and scripts/play_promote.sh only promotes if
# the track below holds exactly that code with exactly that bundle's SHA-256.
#
# Who can sign and publish. Each key's signer account, and each Play
# account, trusts exactly one value of
#   <GitHub environment>|<owner>/<repo>/.github/workflows/release.yml@<ref>
# The dev key trusts the dev environment on refs/heads/dev; the play key and
# the Play tester account (testing tracks only) trust qa on refs/heads/main;
# the release key and the Play publisher account (production) trust prod on
# refs/heads/main, and prod has a required reviewer. So nothing reaches
# production users, or signs as the key F-Droid users trust, without that
# approval. An edited copy on another branch, a pull request, or a qa run
# asking for the release key are all refused by Google. Anyone who can push
# to dev can change this file there and sign with the dev key (only the dev
# key), so dev takes changes through pull requests; anyone who can push to
# main can reach internal and closed testers, so main does too.
#
# Tags. A workflow triggered by a tag push runs the tag's copy of itself, as
# refs/tags/..., which the keys don't trust, and which anyone could have
# edited before tagging. So tags don't trigger this file directly: a tag
# push runs build.yml, and when that finishes, workflow_run starts this
# file, which GitHub always runs from main. This copy then checks that the
# tag points at a commit already on main and that the tag matches the app's
# versionName, before doing anything. The jobs that sign or publish take
# their scripts and certificates from main, not from the tag. A tag ruleset
# keeps v* tags from being moved or deleted, so to run a tag again (after a
# failure, or the first run for a key), use "Run workflow" on main with the
# tag's name.
#
# The jobs that hold credentials don't build: they sign or upload what a
# job without credentials made, so none of Gradle's or pip's dependencies run
# where the credentials are. Each account can do one thing: a signer per
# key, app-distribute (App Distribution only), the Play tester (testing
# tracks of this app) and the Play publisher (production of this app). There
# are no keystores, passwords or keys in GitHub or on the runner.
#
# Each prod run rebuilds the APK on a second, fresh runner and checks the two
# are identical, the check F-Droid makes, so a release F-Droid would reject
# fails before the approval is asked for. Play bundles take their version code
# from the run number instead (-PplayVersionCode), so every main push can
# upload; F-Droid never builds them.
#
# Which Google Cloud project, keys, accounts and apps to use comes from
# Actions variables (Settings > Secrets and variables > Actions >
# Variables), not from this file, so a fork doesn't point at this
# repository's infrastructure. Most are set per GitHub environment under the
# same name: KMS_KEY and SIGNER are the dev key in dev, the play key in qa
# and the release key in prod; PLAY_PUBLISHER is the tester account in qa and
# the publisher account in prod. README.md lists them; the values are from
# `tofu output` in mobile-build-infra (build/ and bootstrap/). They aren't
# secrets: the Workload Identity bindings are what protect the keys. Each
# job that needs them checks them first and, when they aren't set, does
# nothing but warn, and the jobs after it are skipped, so a fork with none
# of them still builds (the unsigned build is in the run's artifacts).
#
# The first run for a key has no certificate to attach yet
# (signing-certs/<key>.pem). That run makes it, signs with it and attaches
# it to the run instead of shipping. Commit it, then run again.

on:
  push:
    branches: [dev, main]
  workflow_run:
    workflows: [Build]
    types: [completed]
  # Runs a tag again: after a failure, or once a new certificate is on main.
  # Only from main; setup refuses anything else.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, vX.Y.Z-rc.N or vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

env:
  # Everything this repository's infrastructure decides is an Actions
  # variable instead (README.md, "Release configuration"). They're read in
  # each job's "is configured" step, not here: environment variables are
  # only visible to the jobs that run in that environment.
  INTERNAL_TRACK: internal
  CLOSED_TRACK: alpha
  PROD_TRACK: production
  # Google's PKCS#11 library for Cloud KMS, from its GitHub release. Pinned
  # by hash, and its signature is checked against Google's release key too.
  KMSP11_VERSION: "1.9"
  KMSP11_SHA256: 5397f965073cd5d1e2c43e5148f102f31a7c835902f97eb41c7c9c0f1b876a40
  # The APK signing library (scripts/KmsApkSigner.java), from Google's Maven
  # repository. Matches AGP in gradle/libs.versions.toml.
  APKSIG_VERSION: 8.11.1
  APKSIG_SHA256: c070ed1394629d74641aa0906f60b2ffa1ee77e6366a1f93437f59717b1aeb89

# One release per branch or tag at a time, never cancelled half-signed. Build
# runs for pull requests also start this file (and stop at setup); they each
# get their own group, so a branch named like a tag can't queue behind, or
# cancel, a real release.
concurrency:
  group: >-
    release-${{
      github.event_name == 'push' && github.ref ||
      github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) ||
      (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')) &&
        format('refs/tags/{0}', github.event.workflow_run.head_branch) ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  # Decides what this run is. Build's workflow_run fires for every Build run;
  # only a successful one for a pushed v* tag is a release.
  setup:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.what.outputs.channel }}
      environment: ${{ steps.what.outputs.environment }}
      sha: ${{ steps.what.outputs.sha }}
      tag: ${{ steps.what.outputs.tag }}
      version: ${{ steps.what.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: What to build
        id: what
        env:
          EVENT: ${{ github.event_name }}
          # Tag names are text whoever pushed the tag wrote: through env,
          # never pasted into the script.
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_TAG_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = push ]; then
            case "$GITHUB_REF" in
              refs/heads/dev)  channel=dev;      environment=dev ;;
              refs/heads/main) channel=internal; environment=qa ;;
              *) echo "::error::Release runs on dev and main only; the keys trust nothing else."; exit 1 ;;
            esac
            {
              echo "channel=$channel"
              echo "environment=$environment"
              echo "sha=$GITHUB_SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Tag releases run from main only; the keys trust nothing else."
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            TAG=$INPUT_TAG
          else
            TAG=$RUN_TAG
          fi
          if [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            version=${BASH_REMATCH[1]}
            if [ -n "${BASH_REMATCH[2]}" ]; then
              channel=closed; environment=qa
            else
              channel=prod; environment=prod
            fi
          else
            echo "::error::$TAG isn't a release tag: use vX.Y.Z-rc.N for closed testing or vX.Y.Z for production."
            exit 1
          fi
          # A branch can share a tag's name; make sure this really is the tag
          # (peeled, so lightweight and annotated tags both work), and for a
          # tag push, still where Build saw it.
          tag_sha=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)
          if [ -z "$tag_sha" ]; then
            echo "::error::There is no tag $TAG."
            exit 1
          fi
          if [ "$EVENT" = workflow_run ] && [ "$tag_sha" != "$RUN_TAG_SHA" ]; then
            echo "::error::Tag $TAG is at $tag_sha, not $RUN_TAG_SHA as built. Was it moved or deleted?"
            exit 1
          fi
          # Only release what has been merged to main.
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "::error::$TAG (${tag_sha::7}) isn't on main. Tag a commit after it's merged."
            exit 1
          fi
          # F-Droid reads the version from the source at the tag, and Play
          # testers see it, so the tag and versionName must agree.
          source_version=$(git show "$tag_sha:app/build.gradle.kts" | sed -n 's/.*versionName = "\(.*\)".*/\1/p' | head -1)
          if [ "$source_version" != "$version" ]; then
            echo "::error::$TAG doesn't match versionName $source_version in app/build.gradle.kts at ${tag_sha::7}."
            exit 1
          fi
          # Production gets what closed testers had: the release tag needs an
          # rc of the same version on the same commit.
          if [ "$channel" = prod ]; then
            rcs=$(git tag --points-at "$tag_sha" --list "v$version-rc.*" | grep -E "^v$version-rc\.[0-9]+$" || true)
            if [ -z "$rcs" ]; then
              echo "::error::No v$version-rc.N tag on ${tag_sha::7}. Release the commit closed testers have: tag it vX.Y.Z-rc.N first."
              exit 1
            fi
            echo "rc tags on this commit: $(echo $rcs)"
          fi
          {
            echo "channel=$channel"
            echo "environment=$environment"
            echo "sha=$tag_sha"
            echo "tag=$TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Release::$TAG ($tag_sha) -> $channel"

  # For a tag: the Play bundle main built from the tagged commit, and proof of
  # where it came from. No credentials here beyond reading this repository.
  # The jobs that promote take the version code and SHA-256 from this job's
  # outputs, and Play must agree with both.
  bundle:
    needs: setup
    if: needs.setup.outputs.channel == 'closed' || needs.setup.outputs.channel == 'prod'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the main run and its artifact
      attestations: read
    outputs:
      code: ${{ steps.run.outputs.code }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - name: Find the main run that built this commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          # Successful runs of this file for a push to main at exactly this
          # commit, newest first, that still have their bundle.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&branch=main&head_sha=$SHA&status=success&per_page=20" \
            --jq '.workflow_runs | sort_by(.run_number) | reverse | .[] | "\(.id) \(.run_number)"')
          found=
          while read -r id number; do
            [ -n "$id" ] || continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?name=bundle-internal" \
                 --jq '.artifacts[] | select(.expired == false) | .id' | grep -q .; then
              found="$id $number"
              break
            fi
          done <<<"$runs"
          if [ -z "$found" ]; then
            echo "::error title=No bundle::No successful push to main built ${SHA::7} with its bundle still kept. Tag a commit main has built and uploaded to internal (within the artifact retention)."
            exit 1
          fi
          read -r id number <<<"$found"
          {
            echo "id=$id"
            echo "code=$((number + 100000))"
          } >> "$GITHUB_OUTPUT"
          echo "Main run $id (#$number): version code $((number + 100000))"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-internal
          path: bundle
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Check the bundle's provenance
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.setup.outputs.sha }}
          CODE: ${{ steps.run.outputs.code }}
          TAG: ${{ needs.setup.outputs.tag }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          aabs=(bundle/*-"$CODE".aab)
          if [ ${#aabs[@]} -ne 1 ]; then
            echo "::error::Expected one bundle with version code $CODE in run $RUN_ID, found ${#aabs[@]}."
            exit 1
          fi
          aab=${aabs[0]}
          # Signed by this file, as committed on main, from exactly the tagged
          # commit, on a GitHub-hosted runner.
          gh attestation verify "$aab" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --source-digest "$SHA" \
            --deny-self-hosted-runners
          sha256=$(sha256sum "$aab" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          # What the approval is for, where the reviewer can read it first.
          {
            echo "### What this run will promote"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| Built by | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID |"
            echo "| Version code | $CODE |"
            echo "| Bundle SHA-256 | \`$sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: setup
    if: needs.setup.outputs.channel != 'closed'
    runs-on: ubuntu-24.04
    env:
      CHANNEL: ${{ needs.setup.outputs.channel }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}
          # dev's versionName counts commits, so it needs the history
          # (app/build.gradle.kts). Play and prod builds don't read git, and
          # stay a shallow clone like F-Droid's.
          fetch-depth: ${{ needs.setup.outputs.channel == 'dev' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      # No Gradle cache outside dev: Play and prod builds start clean, as
      # F-Droid's do.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ needs.setup.outputs.channel != 'dev' }}

      # dev builds have their own package, and Play bundles their own
      # version-code range, so their codes only need to grow among
      # themselves: this workflow's run number, offset. prod takes its code
      # from the source.
      - name: Build
        run: |
          case "$CHANNEL" in
            dev)      ./gradlew --no-daemon --no-build-cache assembleDevRelease -PdevVersionCode=$((GITHUB_RUN_NUMBER + 1000)) ;;
            internal) ./gradlew --no-daemon --no-build-cache bundleProdRelease -PplayVersionCode=$((GITHUB_RUN_NUMBER + 100000)) ;;
            prod)     ./gradlew --no-daemon --no-build-cache assembleProdRelease ;;
          esac

      - name: Collect the unsigned build
        run: |
          mkdir -p out
          case "$CHANNEL" in
            dev)      cp app/build/outputs/apk/dev/release/app-dev-release-unsigned.apk out/ ;;
            internal) cp app/build/outputs/bundle/prodRelease/app-prod-release.aab out/ ;;
            prod)     cp app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk out/ ;;
          esac
          sha256sum out/*

      - name: Version
        id: version
        env:
          TAG_VERSION: ${{ needs.setup.outputs.version }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          if [ "$CHANNEL" = internal ]; then
            version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
            echo "code=$((GITHUB_RUN_NUMBER + 100000))" >> "$GITHUB_OUTPUT"
          else
            aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
            version=$("$aapt2" dump badging out/*.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # setup checked the source; this checks what Gradle actually built.
          if [ -n "$TAG" ] && [ "$version" != "$TAG_VERSION" ]; then
            echo "::error::$TAG doesn't match versionName $version in the built APK."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # A second build of the same commit on a fresh runner, with nothing shared
  # with the first. verify-build checks the two APKs are identical.
  rebuild:
    needs: setup
    if: needs.setup.outputs.channel == 'prod'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - run: ./gradlew --no-daemon --no-build-cache assembleProdRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild
          path: app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # dev only: the dev key. (prod signs in `ship`, behind the approval.)
  # Scripts and certificates come from dev, the branch being built.
  sign-apk:
    needs: [setup, build]
    if: needs.setup.outputs.channel == 'dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      KEY_NAME: dev
      APK_NAME: carrier-pigeon-dev-${{ needs.build.outputs.version }}.apk
      # apksig signs with SHA-512 for 4096-bit RSA keys, so these keys must be
      # RSA_SIGN_PKCS1_4096_SHA512 in KMS (docs/signing.md).
      KMS_DIGEST: sha512
    outputs:
      signed: ${{ steps.configured.outputs.ok }}
      first: ${{ steps.first.outputs.first }}
    steps:
      # KMS_KEY and SIGNER in dev are the dev key.
      - name: Signing is configured
        id: configured
        env:
          WHAT: Signing
          ENVIRONMENT: dev
          NEEDED: GCP_WIF_PROVIDER KMS_KEY SIGNER
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          SIGNER: ${{ vars.SIGNER }}
        run: |
          missing=()
          for v in $NEEDED; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; else missing+=("$v"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=$WHAT skipped::Set ${missing[*]} in the variables of the $ENVIRONMENT environment (or the repository's). See README.md, Release configuration."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.configured.outputs.ok == 'true'
        with:
          name: unsigned
          path: out
      - name: First signing with this key?
        if: steps.configured.outputs.ok == 'true'
        id: first
        run: |
          cert="signing-certs/$KEY_NAME.pem"
          echo "CERT=$cert" >> "$GITHUB_ENV"
          if [ ! -f "$cert" ]; then
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=New certificate::$cert doesn't exist yet. This run makes it and signs with it, but ships nothing. Commit it (from the new-cert-$KEY_NAME artifact), then release again."
          fi

      # The library signs with the short-lived credentials file this writes
      # to the workspace.
      # Only for a new certificate. Installed before the job has any
      # credentials, as nothing from a package index runs after auth.
      - name: Install OpenSSL's PKCS#11 engine
        if: steps.first.outputs.first
        run: sudo apt-get install --yes --no-install-recommends libengine-pkcs11-openssl
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.configured.outputs.ok == 'true'
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.SIGNER }}
      - name: Install the Cloud KMS PKCS#11 library
        if: steps.configured.outputs.ok == 'true'
        run: scripts/install_kmsp11.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.configured.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Get apksig
        if: steps.configured.outputs.ok == 'true'
        run: |
          jar="$RUNNER_TEMP/apksig-$APKSIG_VERSION.jar"
          curl --silent --show-error --fail --location -o "$jar" \
            "https://dl.google.com/android/maven2/com/android/tools/build/apksig/$APKSIG_VERSION/apksig-$APKSIG_VERSION.jar"
          echo "$APKSIG_SHA256  $jar" | sha256sum --check --strict
          echo "APKSIG_JAR=$jar" >> "$GITHUB_ENV"

      - name: Make the certificate
        if: steps.first.outputs.first
        run: |
          scripts/kms_sign.sh cert "$CERT" "Carrier Pigeon ($KEY_NAME)"

      # kms_sign.sh checks the APK verifies and carries this certificate.
      - name: Sign the APK
        if: steps.configured.outputs.ok == 'true'
        run: |
          mkdir -p signed
          scripts/kms_sign.sh apk out/app-dev-release-unsigned.apk "signed/$APK_NAME" "$CERT"
          [ -z "${{ steps.first.outputs.first }}" ] || cp "$CERT" signed/

      # A new certificate is kept even if signing fails, so the next run
      # doesn't make a different one.
      - name: Keep a new certificate
        if: always() && steps.first.outputs.first
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: new-cert-${{ env.KEY_NAME }}
          path: ${{ env.CERT }}
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.configured.outputs.ok == 'true'
        with:
          name: signed-dev
          path: signed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # dev builds to testers through Firebase App Distribution, as
  # app-distribute, which can do nothing else.
  distribute:
    needs: [setup, build, sign-apk]
    if: >-
      needs.setup.outputs.channel == 'dev' && needs.sign-apk.outputs.signed == 'true' &&
      !needs.sign-apk.outputs.first
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      APK: signed/carrier-pigeon-dev-${{ needs.build.outputs.version }}.apk
      # Through env, never pasted into the script: commit messages are text
      # anyone with push access writes.
      HEAD_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: App Distribution is configured
        id: configured
        env:
          WHAT: App Distribution
          ENVIRONMENT: dev
          NEEDED: GCP_WIF_PROVIDER FIREBASE_DISTRIBUTOR FIREBASE_APP_ID FIREBASE_TESTER_GROUP
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          FIREBASE_DISTRIBUTOR: ${{ vars.FIREBASE_DISTRIBUTOR }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}
        run: |
          missing=()
          for v in $NEEDED; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; else missing+=("$v"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=$WHAT skipped::Set ${missing[*]} in the variables of the $ENVIRONMENT environment (or the repository's). See README.md, Release configuration."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.configured.outputs.ok == 'true'
        with:
          name: signed-dev
          path: signed
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.configured.outputs.ok == 'true'
        id: auth
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.FIREBASE_DISTRIBUTOR }}
          token_format: access_token
      # App Distribution's REST API with curl and jq: no third-party action
      # or npm package runs where the token is.
      - name: Upload to App Distribution
        if: steps.configured.outputs.ok == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          api=https://firebaseappdistribution.googleapis.com
          project_number=$(cut -d: -f2 <<<"$FIREBASE_APP_ID")
          app="projects/$project_number/apps/$FIREBASE_APP_ID"
          auth=(--header "Authorization: Bearer $TOKEN")
          # On an HTTP error, show Google's error body (it names what's
          # missing) instead of only curl's status line.
          call() {
            local out
            if ! out=$(curl --silent --show-error --fail-with-body "${auth[@]}" "$@"); then
              echo "::error title=API call failed::${*: -1}: $(jq -c '.error // .' <<<"$out" 2>/dev/null || echo "$out")" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          test -f "$APK"
          op=$(call --request POST \
            --header "X-Goog-Upload-Protocol: raw" \
            --header "X-Goog-Upload-File-Name: $(basename "$APK")" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "$api/upload/v1/$app/releases:upload" | jq -r .name)
          echo "Upload operation: $op"

          # Processing usually takes seconds; give it five minutes.
          for _ in $(seq 60); do
            result=$(call "$api/v1/$op")
            [ "$(jq -r '.done // false' <<<"$result")" = true ] && break
            sleep 5
          done
          if [ "$(jq -r '.done // false' <<<"$result")" != true ]; then
            echo "::error title=Upload not processed::App Distribution didn't finish processing the APK in time."
            exit 1
          fi
          if jq -e .error <<<"$result" >/dev/null; then
            echo "::error title=Upload failed::$(jq -c .error <<<"$result")"
            exit 1
          fi
          release=$(jq -r .response.release.name <<<"$result")
          echo "$(jq -r '.response.result // "uploaded"' <<<"$result"): $release"

          subject=${HEAD_MESSAGE%%$'\n'*}
          notes="${subject:-Manual run} (${GITHUB_SHA::7})"
          details=$(call --request PATCH --header "Content-Type: application/json" \
            --data "$(jq -n --arg t "$notes" '{releaseNotes: {text: $t}}')" \
            "$api/v1/$release?updateMask=release_notes.text")

          call --request POST --header "Content-Type: application/json" \
            --data "$(jq -n --arg g "$FIREBASE_TESTER_GROUP" '{groupAliases: [$g]}')" \
            "$api/v1/$release:distribute" >/dev/null

          echo "Distributed $(jq -r .displayVersion <<<"$details") ($(jq -r .buildVersion <<<"$details")) to $FIREBASE_TESTER_GROUP: $notes"
          # Not binaryDownloadUri: it downloads the APK without signing in, and
          # run logs are readable by anyone who can read the repository.
          {
            echo "### Firebase App Distribution"
            echo "Release $(jq -r .displayVersion <<<"$details") to \`$FIREBASE_TESTER_GROUP\`: $notes"
            echo
            echo "Testers: $(jq -r '.testingUri // "n/a"' <<<"$details")"
          } >> "$GITHUB_STEP_SUMMARY"

  # The bundle for Play, signed with the upload key. Play App Signing re-signs
  # it with the key Google holds, so Play builds don't carry the release key.
  # Its build provenance is what the rc and release tags check later.
  sign-bundle:
    needs: [setup, build]
    if: needs.setup.outputs.channel == 'internal'
    runs-on: ubuntu-24.04
    environment: qa
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # jarsigner is told the algorithm, so the play key stays
      # RSA_SIGN_PKCS1_4096_SHA256.
      KMS_DIGEST: sha256
      CERT: signing-certs/play.pem
      AAB: signed/carrier-pigeon-${{ needs.build.outputs.version }}-${{ needs.build.outputs.code }}.aab
    outputs:
      signed: ${{ steps.configured.outputs.ok }}
      first: ${{ steps.first.outputs.first }}
    steps:
      # KMS_KEY and SIGNER in qa are the play (upload) key.
      - name: Signing is configured
        id: configured
        env:
          WHAT: Signing
          ENVIRONMENT: qa
          NEEDED: GCP_WIF_PROVIDER KMS_KEY SIGNER
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          SIGNER: ${{ vars.SIGNER }}
        run: |
          missing=()
          for v in $NEEDED; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; else missing+=("$v"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=$WHAT skipped::Set ${missing[*]} in the variables of the $ENVIRONMENT environment (or the repository's). See README.md, Release configuration."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.configured.outputs.ok == 'true'
        with:
          name: unsigned
          path: out
      - name: First signing with this key?
        if: steps.configured.outputs.ok == 'true'
        id: first
        run: |
          if [ ! -f "$CERT" ]; then
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=New certificate::$CERT doesn't exist yet. This run makes it; commit it from the bundle-internal artifact. Upload that first bundle to Play Console by hand when you create the app there."
          fi
      # Only for a new certificate. Installed before the job has any
      # credentials, as nothing from a package index runs after auth.
      - name: Install OpenSSL's PKCS#11 engine
        if: steps.first.outputs.first
        run: sudo apt-get install --yes --no-install-recommends libengine-pkcs11-openssl
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.configured.outputs.ok == 'true'
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.SIGNER }}
      - name: Install the Cloud KMS PKCS#11 library
        if: steps.configured.outputs.ok == 'true'
        run: scripts/install_kmsp11.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.configured.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Make the upload certificate
        if: steps.first.outputs.first
        run: |
          scripts/kms_sign.sh cert "$CERT" "Carrier Pigeon (Play upload)"
      - name: Sign the bundle
        if: steps.configured.outputs.ok == 'true'
        run: |
          mkdir -p signed
          cp out/app-prod-release.aab "$AAB"
          scripts/kms_sign.sh aab "$AAB" "$CERT"
          sha256sum "$AAB"
          [ -z "${{ steps.first.outputs.first }}" ] || cp "$CERT" signed/
      # Records, signed by GitHub, that this file on main built this bundle
      # from this commit. The tags check it before promoting the bundle.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.configured.outputs.ok == 'true'
        with:
          subject-path: ${{ env.AAB }}
      # Kept for 90 days: an rc or release tag needs it to know which bundle
      # this commit is, so tag within that.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.configured.outputs.ok == 'true'
        with:
          name: bundle-internal
          path: signed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  # Each main build becomes the release on Play's internal track, as the Play
  # tester account (testing tracks only). Its name shows the commit, for
  # people; the tags go by version code.
  upload-internal:
    needs: [setup, build, sign-bundle]
    if: >-
      needs.setup.outputs.channel == 'internal' && needs.sign-bundle.outputs.signed == 'true' &&
      !needs.sign-bundle.outputs.first
    runs-on: ubuntu-24.04
    environment: qa
    # One testing-track change at a time. A newer one waiting replaces an
    # older one waiting, which for internal is what we want anyway.
    concurrency:
      group: google-play-testing
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AAB: signed/carrier-pigeon-${{ needs.build.outputs.version }}-${{ needs.build.outputs.code }}.aab
      # Play allows 50 characters, so the commit is abbreviated in the step.
      RELEASE_NAME_PREFIX: ${{ needs.build.outputs.version }} (${{ needs.build.outputs.code }})
      RELEASE_SHA: ${{ needs.setup.outputs.sha }}
    steps:
      # PLAY_PUBLISHER in qa is the Play tester account.
      - name: Google Play is configured
        id: configured
        env:
          WHAT: Google Play
          ENVIRONMENT: qa
          NEEDED: GCP_WIF_PROVIDER PLAY_PACKAGE PLAY_PUBLISHER
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PLAY_PACKAGE: ${{ vars.PLAY_PACKAGE }}
          PLAY_PUBLISHER: ${{ vars.PLAY_PUBLISHER }}
        run: |
          missing=()
          for v in $NEEDED; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; else missing+=("$v"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=$WHAT skipped::Set ${missing[*]} in the variables of the $ENVIRONMENT environment (or the repository's). See README.md, Release configuration."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.configured.outputs.ok == 'true'
        with:
          name: bundle-internal
          path: signed
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.configured.outputs.ok == 'true'
        id: auth
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_PUBLISHER }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      # The Play Developer API with curl and jq: no third-party action runs
      # where the token is.
      - name: Upload to the internal track
        if: steps.configured.outputs.ok == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          RELEASE_NAME="$RELEASE_NAME_PREFIX ${RELEASE_SHA::12}"
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PLAY_PACKAGE"
          upload="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PLAY_PACKAGE"
          auth=(--header "Authorization: Bearer $TOKEN")
          # On an HTTP error, show Google's error body (it names what's
          # missing) instead of only curl's status line.
          call() {
            local out
            if ! out=$(curl --silent --show-error --fail-with-body "${auth[@]}" "$@"); then
              echo "::error title=API call failed::${*: -1}: $(jq -c '.error // .' <<<"$out" 2>/dev/null || echo "$out")" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          test -f "$AAB"
          edit=$(call --request POST "$api/edits" | jq -r .id)
          code=$(call --request POST --header "Content-Type: application/octet-stream" \
            --data-binary "@$AAB" "$upload/edits/$edit/bundles?uploadType=media" | jq -r .versionCode)
          echo "Uploaded version code $code"
          call --request PUT --header "Content-Type: application/json" \
            --data "$(jq -n --arg n "$RELEASE_NAME" --arg c "$code" \
              '{releases: [{name: $n, versionCodes: [$c], status: "completed"}]}')" \
            "$api/edits/$edit/tracks/$INTERNAL_TRACK" >/dev/null
          call --request POST "$api/edits/$edit:commit" >/dev/null
          echo "### Google Play" >> "$GITHUB_STEP_SUMMARY"
          echo "$RELEASE_NAME on \`$INTERNAL_TRACK\`" >> "$GITHUB_STEP_SUMMARY"

  # rc tag: the build internal testers have now, if it's the one main built
  # from the tagged commit, moves to the closed track unchanged. As the Play
  # tester account, which can't touch production.
  promote-closed:
    needs: [setup, bundle]
    if: needs.setup.outputs.channel == 'closed'
    runs-on: ubuntu-24.04
    environment: qa
    concurrency:
      group: google-play-testing
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Play is configured
        id: configured
        env:
          WHAT: Google Play
          ENVIRONMENT: qa
          NEEDED: GCP_WIF_PROVIDER PLAY_PACKAGE PLAY_PUBLISHER
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PLAY_PACKAGE: ${{ vars.PLAY_PACKAGE }}
          PLAY_PUBLISHER: ${{ vars.PLAY_PUBLISHER }}
        run: |
          missing=()
          for v in $NEEDED; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; else missing+=("$v"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=$WHAT skipped::Set ${missing[*]} in the variables of the $ENVIRONMENT environment (or the repository's). See README.md, Release configuration."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.configured.outputs.ok == 'true'
        id: auth
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_PUBLISHER }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Promote internal to closed
        if: steps.configured.outputs.ok == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          TAG: ${{ needs.setup.outputs.tag }}
          CODE: ${{ needs.bundle.outputs.code }}
          BUNDLE_SHA256: ${{ needs.bundle.outputs.sha256 }}
        run: scripts/play_promote.sh "$INTERNAL_TRACK" "$CLOSED_TRACK" "$TAG" "$CODE" "$BUNDLE_SHA256"

  # What F-Droid will check, before anyone is asked to approve: the
  # independent rebuild is byte-for-byte the build we will sign.
  verify-build:
    needs: [setup, build, rebuild]
    if: needs.setup.outputs.channel == 'prod'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rebuild
          path: rebuild
      - name: The rebuild is identical
        run: |
          sha256sum out/app-prod-release-unsigned.apk rebuild/app-prod-release-unsigned.apk
          if ! cmp out/app-prod-release-unsigned.apk rebuild/app-prod-release-unsigned.apk; then
            echo "::error::Two clean builds differ, so F-Droid couldn't reproduce this release. Compare the unsigned and rebuild artifacts with diffoscope."
            exit 1
          fi

  # The one job behind the prod approval. It builds nothing and installs
  # nothing from a package index: it signs the APK the build job made (and
  # verify-build reproduced) with the release key, then, as the Play
  # publisher account, promotes the closed build of this commit to
  # production. Read the run summary (from `bundle`) before approving.
  ship:
    needs: [setup, build, bundle, verify-build]
    if: needs.setup.outputs.channel == 'prod'
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      KEY_NAME: release
      KMS_DIGEST: sha512
      APK_NAME: carrier-pigeon-prod-${{ needs.build.outputs.version }}.apk
    outputs:
      signed: ${{ steps.configured.outputs.ok }}
      first: ${{ steps.first.outputs.first }}
      apk_sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      # KMS_KEY and SIGNER in prod are the release key; PLAY_PUBLISHER is the
      # production publisher.
      - name: Release is configured
        id: configured
        env:
          WHAT: Release
          ENVIRONMENT: prod
          NEEDED: GCP_WIF_PROVIDER KMS_KEY SIGNER PLAY_PACKAGE PLAY_PUBLISHER
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          SIGNER: ${{ vars.SIGNER }}
          PLAY_PACKAGE: ${{ vars.PLAY_PACKAGE }}
          PLAY_PUBLISHER: ${{ vars.PLAY_PUBLISHER }}
        run: |
          missing=()
          for v in $NEEDED; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; else missing+=("$v"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=$WHAT skipped::Set ${missing[*]} in the variables of the $ENVIRONMENT environment (or the repository's). See README.md, Release configuration."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.configured.outputs.ok == 'true'
        with:
          name: unsigned
          path: out
      - name: First signing with this key?
        if: steps.configured.outputs.ok == 'true'
        id: first
        run: |
          cert="signing-certs/$KEY_NAME.pem"
          echo "CERT=$cert" >> "$GITHUB_ENV"
          if [ ! -f "$cert" ]; then
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=New certificate::$cert doesn't exist yet. This run makes it and signs with it, but ships nothing. Commit it to main (from the new-cert-$KEY_NAME artifact), then run this workflow on main with this tag."
          fi

      # Only for a new certificate. Installed before the job has any
      # credentials, as nothing from a package index runs after auth.
      - name: Install OpenSSL's PKCS#11 engine
        if: steps.first.outputs.first
        run: sudo apt-get install --yes --no-install-recommends libengine-pkcs11-openssl
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.configured.outputs.ok == 'true'
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.SIGNER }}
      - name: Install the Cloud KMS PKCS#11 library
        if: steps.configured.outputs.ok == 'true'
        run: scripts/install_kmsp11.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.configured.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Get apksig
        if: steps.configured.outputs.ok == 'true'
        run: |
          jar="$RUNNER_TEMP/apksig-$APKSIG_VERSION.jar"
          curl --silent --show-error --fail --location -o "$jar" \
            "https://dl.google.com/android/maven2/com/android/tools/build/apksig/$APKSIG_VERSION/apksig-$APKSIG_VERSION.jar"
          echo "$APKSIG_SHA256  $jar" | sha256sum --check --strict
          echo "APKSIG_JAR=$jar" >> "$GITHUB_ENV"
      - name: Make the certificate
        if: steps.first.outputs.first
        run: |
          scripts/kms_sign.sh cert "$CERT" "Carrier Pigeon ($KEY_NAME)"

      # kms_sign.sh checks the APK verifies and carries this certificate.
      - name: Sign the APK
        id: sign
        if: steps.configured.outputs.ok == 'true'
        run: |
          mkdir -p signed
          scripts/kms_sign.sh apk out/app-prod-release-unsigned.apk "signed/$APK_NAME" "$CERT"
          echo "sha256=$(sha256sum "signed/$APK_NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          [ -z "${{ steps.first.outputs.first }}" ] || cp "$CERT" signed/
      - name: Keep a new certificate
        if: always() && steps.first.outputs.first
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: new-cert-${{ env.KEY_NAME }}
          path: ${{ env.CERT }}
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.configured.outputs.ok == 'true'
        with:
          name: signed-prod
          path: signed/
          if-no-files-found: error
          compression-level: 0
          overwrite: true # a re-run signs again

      # Signing is done; from here the job acts as the Play publisher.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.configured.outputs.ok == 'true' && !steps.first.outputs.first
        id: play
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_PUBLISHER }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      # Checked again here, as the publisher, after the approval: the closed
      # track must still hold exactly the bundle `bundle` found, and the
      # check and promotion are one edit.
      - name: Promote closed to production
        if: steps.configured.outputs.ok == 'true' && !steps.first.outputs.first
        env:
          TOKEN: ${{ steps.play.outputs.access_token }}
          TAG: ${{ needs.setup.outputs.tag }}
          CODE: ${{ needs.bundle.outputs.code }}
          BUNDLE_SHA256: ${{ needs.bundle.outputs.sha256 }}
        run: scripts/play_promote.sh "$CLOSED_TRACK" "$PROD_TRACK" "$TAG" "$CODE" "$BUNDLE_SHA256"

  # F-Droid's own check, without credentials: our signature, copied onto the
  # independent rebuild, gives the APK we signed. apksigcopier comes from
  # PyPI pinned by hash.
  verify-signature:
    needs: [setup, rebuild, ship]
    if: >-
      needs.setup.outputs.channel == 'prod' && needs.ship.outputs.signed == 'true' &&
      !needs.ship.outputs.first
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/apksigcopier-requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rebuild
          path: rebuild
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-prod
          path: signed
      - name: Our signature fits the rebuild (apksigcopier, as F-Droid does)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r scripts/apksigcopier-requirements.txt
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$RUNNER_TEMP/venv/bin/apksigcopier" compare --unsigned signed/*.apk rebuild/app-prod-release-unsigned.apk
          echo "Reproducible: the signed APK is the rebuild plus our signature."

  # The GitHub release for the tag, last, so a tag Play refused or F-Droid
  # would reject gets none; F-Droid builds the tag. The APK must be the one
  # `ship` signed. Re-runs leave an existing release alone.
  github-release:
    needs: [setup, ship, verify-signature]
    if: needs.setup.outputs.channel == 'prod'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-prod
          path: signed
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          APK_SHA256: ${{ needs.ship.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(signed/*.apk)
          [ ${#apks[@]} -eq 1 ] || { echo "::error::Expected one signed APK, found ${#apks[@]}."; exit 1; }
          echo "$APK_SHA256  ${apks[0]}" | sha256sum --check --strict
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice title=Release exists::$TAG already has a GitHub release; leaving it."
            exit 0
          fi
          gh release create "$TAG" "${apks[0]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Carrier Pigeon ${TAG#v}" \
            --generate-notes
